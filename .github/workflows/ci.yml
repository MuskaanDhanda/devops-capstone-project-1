name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint Ansible and shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install yamllint and Ansible
        run: pip install yamllint ansible-core

      - name: Lint YAML
        run: yamllint -d relaxed Ansible/ .github/workflows/

      - name: Ansible syntax check
        working-directory: Ansible
        run: |
          printf '[slave]\nlocalhost ansible_connection=local\n' > ci-hosts
          ansible-playbook -i ci-hosts --syntax-check playbook.yml
          ansible-playbook -i ci-hosts --syntax-check install_code.yml

      - name: ShellCheck
        run: shellcheck --severity=warning Ansible/*.sh
